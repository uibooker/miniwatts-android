name: Android verification
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: |
          mkdir -p .tooling
          keytool -genkeypair -keystore .tooling/debug.keystore -storepass android -keypass android -alias androiddebugkey -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
      - run: ./gradlew --no-daemon :core:test :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: miniwatts-debug-and-reports
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/lint-results-debug.*
            core/build/reports/tests/test/
